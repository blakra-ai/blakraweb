[project]
name = "blakrasocial"
version = "0.1.0"
description = "Social Publisher API: publish to Instagram, Facebook, TikTok, LinkedIn and WhatsApp through one provider-agnostic port."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<1",
    "tenacity>=9.2,<10",
    "structlog>=26.1",
    "pyjwt[crypto]>=2.15,<3",
    "redis>=8.1,<9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "cryptography>=45",
    "aioboto3>=15",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.4",
    "aiosqlite>=0.21",
    "types-aioboto3[s3]>=15.5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blakrasocial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR2004", "S101", "RUF001", "RUF002", "RUF003", "PLC0415", "PLR0911", "PLR0912", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
