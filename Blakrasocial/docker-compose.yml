# Local stack: API + Redis (shared idempotency) + frontend dev build.
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [redis]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:8080"]
    depends_on: [api]
