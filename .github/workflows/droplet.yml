# Builds the site and uploads dist/ to the DigitalOcean droplet served by nginx (/var/www/blakra.us).
# Required repository secrets: DROPLET_HOST (IP), DROPLET_USER, DROPLET_SSH_KEY (private key).
name: Droplet
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: droplet
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /
          VITE_CONTACT_ENDPOINT: /api/contact
      - name: Upload to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "DROPLET_SSH_KEY is not a valid private key"; exit 1; }
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "mkdir -p /var/www/blakra.us"
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" dist/ "$USER@$HOST:/var/www/blakra.us/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy" server/contact/ "$USER@$HOST:/opt/blakra-contact/"
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "cp /opt/blakra-contact/blakra-contact.service /etc/systemd/system/ && systemctl daemon-reload && systemctl enable --now blakra-contact && systemctl restart blakra-contact"
