# Security headers for blakra.us. Copy to /etc/nginx/snippets/blakra-headers.conf
# (it is included by deploy/nginx.conf.example), run `nginx -t`, reload, then check with `curl -I`.
#
# connect-src allows the contact form endpoint (Apps Script answers through a redirect to
# script.googleusercontent.com). style-src needs 'unsafe-inline' for the per-section CSS
# variables in the prerendered markup. frame-ancestors 'none' stops clickjacking.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gysoJ7nLFkTZ27iE4Nj7OxQULW/WWR7HkXRWQoQ5gko='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
