# Security headers for blakra.us. Copy to /etc/nginx/snippets/blakra-headers.conf
# (it is included by deploy/nginx.conf.example), run `nginx -t`, reload, then check with `curl -I`.
# The same headers for other hosts: deploy/_headers (Netlify, Cloudflare Pages) and deploy/vercel.json.
#
# CSP, checked against the built site in Chrome on 2026-11-02 (zero violations, the 3D world running):
# - script-src: the one inline script in index.html is allowed by its hash. If that script changes,
#   recompute: the base64 SHA-256 of the text between <script> and </script>.
# - img-src/connect-src blob:: three.js decodes the model's embedded textures from blob: URLs; without
#   it the figure renders untextured. worker-src blob: covers the loader's decoder worker.
# - connect-src: the contact form endpoint (Apps Script answers through a redirect to
#   script.googleusercontent.com).
# - style-src 'unsafe-inline': the per-section CSS variables in the prerendered markup.
# - frame-ancestors 'none' (and X-Frame-Options for old browsers) stops clickjacking.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gysoJ7nLFkTZ27iE4Nj7OxQULW/WWR7HkXRWQoQ5gko='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: https://script.google.com https://script.googleusercontent.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
